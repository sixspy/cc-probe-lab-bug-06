<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>栏贯验 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">栏贯验</h1>
      <div class="骨">已汇总缓冲与汇总账报文数互证。</div>
    </header>

    <section class="卷">
      <div class="工具"><button class="按钮" id="跑">跑栏贯验</button> <span id="果"></span></div>
      <div class="横排 下距12" id="对账"></div>
      <div class="表绕"><table><thead><tr><th>时刻</th><th>在栏</th><th>正式汇总报文</th><th>归档待删报文</th><th>坏点</th><th>结果</th><th>说明</th></tr></thead><tbody id="表"></tbody></table></div>
    </section>
    <script>
    async function 刷() {
      const 账 = await 探栏.getJSON("/api/统计/汇总对账");
      document.getElementById("对账").innerHTML =
        `<div class="水卡"><div class="数">${账.正式.行数}</div><div class="标">正式汇总行</div></div>` +
        `<div class="水卡"><div class="数">${账.正式.报文数}</div><div class="标">正式报文</div></div>` +
        `<div class="水卡"><div class="数">${账.归档.行数}</div><div class="标">待删影子行</div></div>` +
        `<div class="水卡"><div class="数">${账.归档.待删报文数}</div><div class="标">待删报文</div></div>` +
        `<div class="水卡"><div class="标">正式齐套</div><div class="v">${账.正式齐套 ? 探栏.徽章("齐套","好") : 探栏.徽章("未齐套","危")}</div></div>`;
      const rows = await 探栏.getJSON("/api/栏贯验");
      const tb = document.getElementById("表"); tb.innerHTML = "";
      if (!rows.length) { tb.innerHTML = `<tr><td colspan="7">${探栏.空态("尚无贯验。结栏后点跑栏贯验。")}</td></tr>`; return; }
      for (const r of rows) {
        const ok = r.是否对齐 ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危");
        tb.appendChild(探栏.行(`<td>${探栏.安全文本(r.时刻)}</td><td>${r.在栏笔数}</td><td>${r.汇总报文数}</td><td>${r.归档待删报文 ?? "—"}</td><td>${r.坏点笔数}</td><td>${ok}</td><td>${探栏.安全文本(r.说明)}</td>`));
      }
    }
    document.getElementById("跑").onclick = async () => {
      const d = await 探栏.postJSON("/api/栏贯验/跑");
      document.getElementById("果").innerHTML = d.是否对齐 ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危");
      await 刷();
    };
    刷();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" class="亮">栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
    } catch (e) {}
  })();
  </script>
</body>
</html>
